<!DOCTYPE html>

<html>
<head>
    <title>Edit Product</title>

```
<style>
    body{
        font-family: Arial, sans-serif;
        background:#f4f4f4;
    }

    .container{
        width:500px;
        margin:50px auto;
        background:white;
        padding:20px;
        border-radius:10px;
        box-shadow:0px 0px 10px rgba(0,0,0,0.2);
    }

    h2{
        text-align:center;
        color:#333;
    }

    input, textarea{
        width:100%;
        padding:10px;
        margin-top:5px;
        margin-bottom:15px;
        border:1px solid #ccc;
        border-radius:5px;
    }

    .current-image{
        width:150px;
        height:150px;
        object-fit:cover;
        margin-bottom:15px;
        border-radius:5px;
    }

    button{
        width:100%;
        padding:12px;
        background:#28a745;
        color:white;
        border:none;
        border-radius:5px;
        cursor:pointer;
    }

    button:hover{
        background:#218838;
    }
</style>
```

</head>
<body>

<div class="container">

```
<h2>Edit Product</h2>

<form method="POST" enctype="multipart/form-data">
    {% csrf_token %}

    <label>Product Name</label>
    <input type="text"
           name="product_name"
           value="{{ product.product_name }}"
           required>

    <label>Description</label>
    <textarea name="description" rows="4" required>{{ product.description }}</textarea>

    <label>Price</label>
    <input type="number"
           step="0.01"
           name="price"
           value="{{ product.price }}"
           required>

    <label>Stock</label>
    <input type="number"
           name="stock"
           value="{{ product.stock }}"
           required>

    <label>Current Image</label><br>

    <img src="{{ product.product_image.url }}"
         class="current-image">

    <label>Change Image</label>
    <input type="file" name="product_image">

    <button type="submit">
        Update Product
    </button>

</form>
```

</div>

</body>
</html>
