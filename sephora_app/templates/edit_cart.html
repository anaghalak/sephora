<!DOCTYPE html>
<html>
<head>
    <title>Edit Cart</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            background:#f4f4f4;
            padding:20px;
        }

        h1{
            text-align:center;
            margin-bottom:30px;
        }

        table{
            width:100%;
            background:white;
            border-collapse:collapse;
            box-shadow:0 0 10px rgba(0,0,0,0.1);
        }

        th, td{
            padding:15px;
            text-align:center;
            border-bottom:1px solid #ddd;
        }

        th{
            background:#007bff;
            color:white;
        }

        img{
            width:80px;
            height:80px;
            object-fit:cover;
            border-radius:5px;
        }

        .qty-input{
            width:60px;
            padding:5px;
            text-align:center;
        }

        .update-btn{
            background:#28a745;
            color:white;
            border:none;
            padding:8px 12px;
            border-radius:5px;
            cursor:pointer;
        }

        .remove-btn{
            background:red;
            color:white;
            text-decoration:none;
            padding:8px 12px;
            border-radius:5px;
        }

        .total{
            margin-top:20px;
            text-align:right;
            font-size:24px;
            font-weight:bold;
        }
    </style>
</head>
<body>

<h1>My Cart</h1>

<table>
    <tr>
        <th>Image</th>
        <th>Product</th>
        <th>Price</th>
        <th>Quantity</th>
        <th>Subtotal</th>
        <th>Action</th>
    </tr>

    {% for item in cart_items %}
    <tr>

        <td>
            {% if item.product.product_image %}
            <img src="{{ item.product.product_image.url }}">
            {% endif %}
        </td>

        <td>{{ item.product.product_name }}</td>

        <td>₹{{ item.product.price }}</td>

        <td>
            <form action="{% url 'update_cart' item.id %}" method="POST">
                {% csrf_token %}
                <input type="number"
                       name="quantity"
                       value="{{ item.quantity }}"
                       min="1"
                       class="qty-input">

                <button type="submit" class="update-btn">
                    Update
                </button>
            </form>
        </td>

        <td>
            ₹{{ item.product.price|floatformat:2|add:"0" }}
        </td>

        <td>
            <a href="{% url 'remove_cart_item' item.id %}"
               class="remove-btn">
               Remove
            </a>
        </td>

    </tr>
    {% endfor %}
</table>

<div class="total">
    Total: ₹{{ total }}
</div>

</body>
</html>
