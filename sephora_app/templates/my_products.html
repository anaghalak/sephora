<!DOCTYPE html>
<html>
<head>
    <title>My Products</title>
    <style>
        body{
            font-family: Arial;
            background:#f4f4f4;
        }

        .container{
            width:80%;
            margin:auto;
        }

        .card{
            background:white;
            padding:15px;
            margin:15px 0;
            border-radius:10px;
            box-shadow:0 0 10px rgba(0,0,0,.1);
        }

        img{
            width:150px;
            height:150px;
            object-fit:cover;
        }

        .btn{
            background:#007bff;
            color:white;
            padding:8px 15px;
            text-decoration:none;
            border-radius:5px;
        }
    </style>
</head>
<body>

<div class="container">

    <h2>My Products</h2>

    {% for product in products %}
    <div class="card">

        <img src="{{ product.product_image.url }}" alt="">

        <h3>{{ product.product_name }}</h3>

        <p>{{ product.description }}</p>

        <p>Price: ₹{{ product.price }}</p>

        <p>Stock: {{ product.stock }}</p>

        <a href="{% url 'edit_product' product.id %}" class="btn">
            Edit Product
        </a>
        <a href="{% url 'delete_product' product.id %}"
        class="btn delete-btn"
        onclick="return confirm('Are you sure you want to delete this product?');">
        Delete Product
        </a>

    </div>
    {% empty %}
        <h3>No products added yet.</h3>
    {% endfor %}

</div>

</body>
</html>
